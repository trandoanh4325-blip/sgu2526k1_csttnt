<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuôi Tôi - Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #333;
    }
    .header {
      background: linear-gradient(45deg, #ff4f8b, #7b2ff7);
      padding: 40px 20px;
      text-align: center;
      color: white;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }
    .avatar {
      width: 200px;
      height: 200px;
      border-radius: 0;
      border: 4px solid white;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .name {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }
    .bio {
      opacity: 0.8;
      margin-top: 5px;
    }

    .section {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .progress-box {
      margin-top: 10px;
    }
    .progress-bg {
      width: 100%;
      height: 18px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(45deg, #ff4f8b, #ff9a3c);
      transition: 0.3s;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      font-size: 18px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: transform 0.15s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .pink { background:#ff4f8b; }
    .yellow { background:#ffcc00; color:black; }
    .green { background:#3cd67a; }

    .pack {
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #ddd;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }
    .share {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      background: #ececec;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="avatar.jpg" class="avatar" />
    <div class="name">EM TRẦN VĂN VÕ DOANH</div>
    <div class="bio">Mình đang cần mọi người nuôi mình mỗi ngày 😎</div>
  </div>

  <div class="section">
    <h3>Chỉ Số Nuôi</h3>
    <div class="stats">
      <div>❤️ <span id="tim">0</span></div>
      <div>⚡ <span id="nl">0</span></div>
      <div>💰 <span id="donate">0</span></div>
    </div>

    <div class="progress-box">
      <p>Tiến độ nuôi hôm nay:</p>
      <div class="progress-bg">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>

    <button class="btn pink" onclick="addTim()">❤️ Cho Tim</button>
    <button class="btn yellow" onclick="addNL()">⚡ Năng Lượng</button>
    <button class="btn green" onclick="addDonate()">💰 Donate</button>
  </div>

  <div class="section">
    <h3>Gói Nuôi</h3>

    <div class="pack">🍜 Gói mì – 1 tim <button class="btn pink" style="padding:5px 10px" onclick="addTim()">Chọn</button></div>
    <div class="pack">🥤 Ly trà sữa – 3 tim <button class="btn pink" style="padding:5px 10px" onclick="addTimX(3)">Chọn</button></div>
    <div class="pack">🍖 Bữa ăn xịn – 5 tim <button class="btn pink" style="padding:5px 10px" onclick="addTimX(5)">Chọn</button></div>

  </div>

  <div class="section share" onclick="copyLink()">📤 Sao chép link nuôi tôi</div>

  <script>
    let tim = 0;
    let nl = 0;
    let donate = 0;

    function update() {
      document.getElementById("tim").textContent = tim;
      document.getElementById("nl").textContent = nl;
      document.getElementById("donate").textContent = donate;

      let total = tim + nl + donate;
      let percent = Math.min(total * 5, 100);
      document.getElementById("progress").style.width = percent + "%";
    }

    function addTim(){ tim++; update(); }
    function addTimX(x){ tim+=x; update(); }
    function addNL(){ nl++; update(); }
    function addDonate(){ donate++; update(); }

    function copyLink(){
      navigator.clipboard.writeText(window.location.href);
      alert("Đã sao chép link!");
    }
  </script>
</body>
</html>
